# =====================================================================
# UCO Kudos API - Configuración (Twelve-Factor: todo lo variable llega por entorno)
# =====================================================================
spring.application.name=uco-kudos-api
server.port=${PORT:8080}
server.shutdown=graceful
server.forward-headers-strategy=framework

# ---------- Persistencia (PostgreSQL) ----------
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/ucokudos}
spring.datasource.username=${DB_USERNAME:ucokudos}
spring.datasource.password=${DB_PASSWORD:ucokudos}
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:5}
# Flyway es dueño del esquema; Hibernate no crea ni altera tablas.
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.flyway.enabled=true

# ---------- Adjuntos ----------
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=26MB

# ---------- Caché de lectura (DRV-002) ----------
spring.cache.type=caffeine
spring.cache.cache-names=kudoFeed,categories
spring.cache.caffeine.spec=maximumSize=500,expireAfterWrite=30s

# ---------- Seguridad ----------
kudos.security.jwt-secret=${JWT_SECRET}
kudos.security.token-ttl=${TOKEN_TTL:8h}
kudos.security.cors-allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# ---------- Notificaciones ----------
kudos.notifications.frontend-url=${FRONTEND_URL:http://localhost:5173}
kudos.notifications.retry.max-attempts=${NOTIFY_MAX_ATTEMPTS:3}
kudos.notifications.retry.backoff-millis=${NOTIFY_BACKOFF_MILLIS:500}

kudos.notifications.email.enabled=${EMAIL_ENABLED:false}
kudos.notifications.email.provider=${EMAIL_PROVIDER:brevo}
kudos.notifications.email.from=${EMAIL_FROM:no-reply@uco.edu.co}
kudos.notifications.email.from-name=${EMAIL_FROM_NAME:UCO Kudos}
kudos.notifications.email.brevo-api-key=${BREVO_API_KEY:}
kudos.notifications.email.brevo-api-url=${BREVO_API_URL:https://api.brevo.com}
# Solo si EMAIL_PROVIDER=smtp
spring.mail.host=${SMTP_HOST:localhost}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

kudos.notifications.whatsapp.enabled=${WHATSAPP_ENABLED:false}
kudos.notifications.whatsapp.account-sid=${TWILIO_ACCOUNT_SID:}
kudos.notifications.whatsapp.auth-token=${TWILIO_AUTH_TOKEN:}
kudos.notifications.whatsapp.from=${TWILIO_WHATSAPP_FROM:+14155238886}
kudos.notifications.whatsapp.api-base-url=${TWILIO_API_URL:https://api.twilio.com}

# ---------- Datos de demostración ----------
kudos.seed.enabled=${SEED_DEMO_DATA:true}
kudos.seed.demo-password=${DEMO_PASSWORD}
kudos.seed.recipient-email=${DEMO_RECIPIENT_EMAIL:}
kudos.seed.recipient-phone=${DEMO_RECIPIENT_PHONE:}

# ---------- Observabilidad ----------
management.endpoints.web.exposure.include=health,info,prometheus,metrics
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=never
management.metrics.tags.application=${spring.application.name}
# El traceId de cada petición aparece en todas las líneas de log.
logging.pattern.correlation=[%X{traceId:-}] 
# En producción: LOGGING_STRUCTURED_FORMAT_CONSOLE=ecs para logs JSON.
