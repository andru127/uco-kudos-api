name: CI/CD Back-End

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository }}
  TRIVY_IMAGE: aquasec/trivy:0.69.3   # versión verificada como segura tras el incidente de marzo de 2026

jobs:
  # ------------------------------------------------------------------ CI
  build-test-sonar:
    name: Compilar, probar y analizar (Sonar)
    runs-on: ubuntu-latest
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0   # Sonar necesita el historial para el análisis de código nuevo

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Pruebas unitarias + integración + cobertura (JaCoCo)
        run: ./mvnw -B verify

      - name: Análisis estático SonarQube Cloud
        if: env.SONAR_TOKEN != ''
        run: >
          ./mvnw -B org.sonarsource.scanner.maven:sonar-maven-plugin:sonar
          -Dsonar.projectKey=${{ vars.SONAR_PROJECT_KEY }}
          -Dsonar.organization=${{ vars.SONAR_ORGANIZATION }}
          -Dsonar.qualitygate.wait=true

      - name: Publicar reportes de pruebas y cobertura
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: reportes-pruebas-backend
          path: |
            target/surefire-reports
            target/site/jacoco

  trivy-fs:
    name: Trivy - dependencias y configuración
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Escaneo de vulnerabilidades del repositorio
        run: |
          docker run --rm -v "$PWD:/src" -w /src $TRIVY_IMAGE fs \
            --scanners vuln,secret,misconfig --severity HIGH,CRITICAL \
            --format table --output trivy-fs.txt .
          cat trivy-fs.txt
          # Bloquea el pipeline solo con vulnerabilidades CRÍTICAS que ya tienen parche
          docker run --rm -v "$PWD:/src" -w /src $TRIVY_IMAGE fs \
            --scanners vuln --severity CRITICAL --ignore-unfixed --exit-code 1 .
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: trivy-fs-backend
          path: trivy-fs.txt

  docker-image:
    name: Imagen Docker + Trivy imagen
    runs-on: ubuntu-latest
    needs: [build-test-sonar, trivy-fs]
    steps:
      - uses: actions/checkout@v5
      - name: Construir imagen
        run: docker build -t $IMAGE:${{ github.sha }} -t $IMAGE:latest .
      - name: Escaneo de la imagen con Trivy
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock $TRIVY_IMAGE image \
            --severity HIGH,CRITICAL --format table $IMAGE:${{ github.sha }} | tee trivy-image.txt
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock $TRIVY_IMAGE image \
            --severity CRITICAL --ignore-unfixed --exit-code 1 $IMAGE:${{ github.sha }}
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: trivy-image-backend
          path: trivy-image.txt
      - name: Publicar imagen en GitHub Container Registry
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
          docker push $IMAGE:${{ github.sha }}
          docker push $IMAGE:latest

  # ------------------------------------------------------------------ CD
  deploy:
    name: Desplegar en Render + prueba de humo
    runs-on: ubuntu-latest
    needs: [docker-image]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    environment: production
    steps:
      - name: Disparar despliegue (deploy hook de Render)
        run: curl -fsS -X POST "${{ secrets.RENDER_DEPLOY_HOOK_URL }}"
      - name: Esperar a que la nueva versión responda (health check)
        run: |
          sleep 60
          for i in $(seq 1 40); do
            status=$(curl -s -o /dev/null -w '%{http_code}' "${{ vars.API_URL }}/actuator/health" || true)
            echo "Intento $i: HTTP $status"
            if [ "$status" = "200" ]; then echo "API arriba ✅"; exit 0; fi
            sleep 15
          done
          echo "La API no respondió a tiempo ❌"; exit 1
