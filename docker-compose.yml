# Entorno local: docker compose up -d db   (solo la base de datos)
#                docker compose up --build  (base de datos + API)
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ucokudos
      POSTGRES_USER: ucokudos
      POSTGRES_PASSWORD: ucokudos
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  api:
    build: .
    depends_on:
      - db
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: jdbc:postgresql://db:5432/ucokudos
      DB_USERNAME: ucokudos
      DB_PASSWORD: ucokudos
      JWT_SECRET: clave-de-desarrollo-local-de-al-menos-32-caracteres
      DEMO_PASSWORD: UcoKudos2026*
      CORS_ALLOWED_ORIGINS: http://localhost:5173

volumes:
  pgdata:
